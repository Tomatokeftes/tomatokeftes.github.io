title: Theodoros Visvikis
tagline: Mass spectrometry imaging and spatial omics
description: >-
  PhD candidate at M4i, Maastricht University, working on mass spectrometry
  imaging, spatial multi-omics data integration and open-source software.
url: "https://tomatokeftes.github.io"
baseurl: ""
lang: en
timezone: Europe/Amsterdam

author:
  name: Theodoros Visvikis
  short: T. Visvikis # shown in bold in author lists

# The contact address, written backwards so that address harvesters reading the pages
# (or this file) don't recognise it; the site turns it round in the visitor's browser.
email_reversed: "ln.ytisrevinuthcirtsaam@sikivsiv.t"

# Menu at the top of every page
nav:
  - title: Publications
    url: /publications/
  - title: Software
    url: /software/
  - title: News
    url: /news/

# Profile links on the home page and in the footer. Icons: github, scholar, orcid, linkedin, mail.
# The entry with `email: true` links to the address above instead of a url.
profiles:
  - label: GitHub
    icon: github
    url: https://github.com/Tomatokeftes
  - label: Google Scholar
    icon: scholar
    url: https://scholar.google.com/citations?user=YciAJH0AAAAJ&hl=en
  - label: ORCID
    icon: orcid
    url: https://orcid.org/0009-0003-5579-5488
  - label: LinkedIn
    icon: linkedin
    url: https://www.linkedin.com/in/theodoros-visvikis/
  - label: Email
    icon: mail
    email: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  news:
    output: false
  publications:
    output: true

# image: the picture link previews show (a paper with a graphical abstract shows that instead)
# mountains: the painting at the foot of a page (see _data/mountains.yml)
defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      image:
        path: /assets/img/social-card.png # made by _tools/social_card.py
        width: 1200
        height: 630
      mountains: cloudy
  - scope:
      path: ""
      type: pages
    values:
      image:
        path: /assets/img/social-card.png # made by _tools/social_card.py
        width: 1200
        height: 630
      mountains: summer

exclude:
  - README.md
