<header class="site-header">
  <div class="wrap site-header__inner">
    {% if page.url == "/" %}<h1 class="brand-title">{% endif %}<a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>{% if page.url == "/" %}</h1>{% endif %}
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
